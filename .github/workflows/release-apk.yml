name: Build release APK

on:
  workflow_dispatch:
  push:
    branches:
      - v4a-oneui
      - v4a-oneui-redesign
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Signing: uses your own keystore when the KEYSTORE_BASE64 secret exists, otherwise a
      # throwaway key is generated so the APK is still installable.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using the keystore from repository secrets."
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
            STORE_PASS="$KEYSTORE_PASSWORD"
            ALIAS="$KEY_ALIAS"
            KEY_PASS="$KEY_PASSWORD"
            echo "SIGNING_MODE=your own keystore" >> "$GITHUB_ENV"
          else
            echo "No keystore secrets found, generating a throwaway key."
            STORE_PASS="ci-throwaway-pass"
            ALIAS="viper-ci"
            KEY_PASS="ci-throwaway-pass"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=ViPER4Android CI, O=CI"
            echo "SIGNING_MODE=throwaway key (each build is signed differently, so you must uninstall the old app before installing a newer build)" >> "$GITHUB_ENV"
          fi
          {
            echo "KEYSTORE_FILE=$KEYSTORE_PATH"
            echo "KEYSTORE_PASSWORD=$STORE_PASS"
            echo "KEY_ALIAS=$ALIAS"
            echo "KEY_PASSWORD=$KEY_PASS"
          } > local.properties

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        id: apk
        run: |
          VERSION=$(grep versionName app/build.gradle.kts | awk -F'"' '{print $2}')
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          NAME="ViPER4Android-${VERSION}-${GITHUB_RUN_NUMBER}.apk"
          mkdir -p dist
          cp "$SRC" "dist/$NAME"
          echo "path=dist/$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify the APK is signed
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose "${{ steps.apk.outputs.path }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ViPER4Android-release-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: ViPER4Android ${{ steps.apk.outputs.version }} (build ${{ github.run_number }})
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: ${{ steps.apk.outputs.path }}
          body: |
            Signed release APK built from `${{ github.ref_name }}` (${{ github.sha }}).
            Signing: ${{ env.SIGNING_MODE }}
